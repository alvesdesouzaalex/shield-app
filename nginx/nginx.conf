worker_processes 1;

events { worker_connections 1024; }

http {
    lua_shared_dict my_cache 10m;

    map $http_authorization $access_token {
       default "";
       "~^Bearer\s+(.+)$" $1;
    }

    server {
        listen 80;

        location = / {
            add_header Content-Type text/plain;
            return 200 "nginx ok\n";
        }

        location /graphql {
            if ($request_method != "POST") {
                return 405 "Method Not Allowed: Only POST is allowed";
            }

            access_by_lua_block {
                ngx.req.read_body()
                local data = ngx.req.get_body_data()
                if not data or data == "" then
                    ngx.status = 400
                    ngx.say("Bad Request: Body required")
                    return ngx.exit(400)
                end
                if not string.find(data, "query") and not string.find(data, "mutation") then
                    ngx.status = 403
                    ngx.say("Forbidden: GraphQL query or mutation required")
                    return ngx.exit(403)
                end
            }

            proxy_pass http://shield-app:9000/graphql;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie "accessToken=$access_token";
        }
    }
}
