# extrai o token do Authorization
map $http_authorization $access_token {
    default "";
    "~^Bearer\s+(.+)$" $1;
}

server {
    listen 80;

    # health check
    location = / {
        add_header Content-Type text/plain;
        return 200 "nginx ok\n";
    }

    # rota GraphQL
    location /graphql {

        # apenas POST é permitido
        if ($request_method != "POST") {
            return 405 "Method Not Allowed: Only POST is allowed";
        }

        # bloqueia requisição sem body
        if ($content_length = "") {
            return 400 "Bad Request: Empty body";
        }

        if ($content_length = 0) {
            return 400 "Bad Request: Empty body";
        }

        proxy_pass http://shield-app:8080/graphql;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # injeta o token como Cookie
        proxy_set_header Cookie "accessToken=$access_token";
    }
}
