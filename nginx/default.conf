# define variável para extrair o token do header Authorization
map $http_authorization $access_token {
   default "";
   "~^Bearer\s+(.+)$" $1;
}

server {
   listen 80;

   location = / {
       if ($content_length = 0) {
          return 400 "Bad Request: Empty body";
       }
       add_header Content-Type text/plain;
       return 200 "nginx ok\n";
   }

   location /graphql {
       if ($request_method != "POST") {
           return 405 "Method Not Allowed: Only POST is allowed";
       }

       if ($content_length = "") {
           return 403 "Bad Request: Empty body";
       }

       if ($content_length = 0) {
           return 403 "GraphQL: Invalid operation";
       }

       proxy_pass http://shield-app:8080/graphql;
       proxy_http_version 1.1;

       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;

       # monta o Cookie com o token extraído
       proxy_set_header Cookie "accessToken=$access_token";
   }
}
